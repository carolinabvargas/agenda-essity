<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Gerencial — Agenda Essity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Identidade visual: layout do PBI Essity (Figma ESSITY, frame AGENDA) */
  :root{
    --pink:#E71C82;
    --pink-dot:#F50082;
    --pink-soft:rgba(231,28,130,0.10);
    --navy:#20244C;
    --navy-tag:#00005A;
    --navy-ink:#ffffff;
    --header-grey:#E7EAEF;
    --bg:#F3F5F8;
    --surface:#ffffff;
    --ink:#20244C;
    --muted:#6B6F8A;
    --border:#E3E5EC;
    --green:#1F7A4F;
    --green-bg:#E3F4EA;
    --pending:#B0136A;
    --pending-bg:#FCE4F0;
    --gold:#B8860B;
    --gold-bg:#FFF7E0;
    --gold-line:#E8C766;
    --shadow:0 1px 3px rgba(32,36,76,.06);
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:"Inter","Segoe UI",-apple-system,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .testeira{
    position:relative; height:84px; background:var(--header-grey); overflow:hidden;
    display:flex; align-items:center; justify-content:space-between; padding:0 28px;
  }
  .testeira::before{
    content:""; position:absolute; inset:0; background:var(--pink);
    clip-path:polygon(0 0, 68% 0, 64% 100%, 0 100%);
  }
  .testeira img{ position:relative; display:block; }
  .testeira .logo-spot{ height:26px; }
  .testeira .logo-essity{ height:44px; }
  .testeira .titulo{
    position:relative; color:#fff; font-weight:800; font-size:15px; letter-spacing:.04em;
    text-transform:uppercase; margin-left:22px; margin-right:auto; padding-left:22px;
    border-left:1px solid rgba(255,255,255,.45);
  }
  .tag{
    display:inline-flex; align-items:center; gap:8px; background:var(--navy-tag); color:#fff;
    font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    padding:7px 14px 7px 8px; border-radius:6px; position:relative; z-index:1;
  }
  .tag::before{ content:""; width:12px; height:12px; border-radius:50%; background:var(--pink-dot); flex:0 0 auto; }
  .panel{ margin-bottom:24px; }
  .panel > .tag{ margin-left:12px; margin-bottom:-12px; }
  .panel-body{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:26px 18px 18px; }

  .wrap{ max-width:1080px; margin:0 auto; padding:24px 20px 60px; }
  header.top{ margin-bottom:22px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header.top h1{ font-size:22px; margin:0 0 4px; color:var(--navy); font-weight:800; }
  header.top .sub{ color:var(--muted); font-size:14px; }
  .refresh-row{ display:flex; align-items:center; gap:10px; }
  button{
    font:inherit; font-size:13px; font-weight:700; cursor:pointer; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); padding:8px 14px; color:var(--ink);
  }
  button:hover{ border-color:var(--navy); }
  button:disabled{ opacity:.5; cursor:default; }
  #refreshBtn{ background:var(--pink); border-color:var(--pink); color:#fff; }
  #refreshBtn:hover{ filter:brightness(1.07); }
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .stat-card{ background:var(--navy); color:#fff; border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .stat-card .label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,255,255,.7); margin-bottom:6px; }
  .stat-card .value{ font-size:26px; font-weight:800; color:#fff; }
  .stat-card .sub{ font-size:12px; color:rgba(255,255,255,.7); margin-top:2px; }
  .stat-card.gold .label{ color:#F3CF6B; }
  .sup-list{ display:flex; flex-direction:column; gap:10px; }
  .sup-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .sup-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; flex-wrap:wrap; }
  .sup-head .name{ font-weight:700; flex:1; min-width:140px; }
  .badge{ font-size:11px; font-weight:800; letter-spacing:.03em; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .badge.ok{ background:var(--green-bg); color:var(--green); }
  .badge.pending{ background:var(--pending-bg); color:var(--pending); }
  .sup-head .pct{ font-size:13px; color:var(--muted); text-align:right; }
  .sup-head .chev{ color:var(--muted); transition:transform .15s; }
  .sup-card.open .chev{ transform:rotate(90deg); }
  .sup-body{ display:none; border-top:1px solid var(--border); padding:14px 16px 18px; }
  .sup-card.open .sup-body{ display:block; }
  .week-mini{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
  .week-mini .d{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; }
  .week-mini .d .n{ font-size:11px; color:var(--muted); text-transform:uppercase; }
  .week-mini .d .c{ font-size:16px; font-weight:800; color:var(--navy); }
  .cdd-group{ margin-bottom:10px; }
  .cdd-group h4{ font-size:12px; text-transform:uppercase; color:var(--navy); margin:12px 0 6px; padding-bottom:4px; border-bottom:2px solid var(--pink); }
  .pdv-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; flex-wrap:wrap; }
  .pdv-row:last-child{ border-bottom:none; }
  .pdv-row .info{ flex:1; min-width:180px; }
  .pdv-row.destaque{ background:var(--gold-bg); border-radius:8px; margin:0 -8px; padding:8px; border-bottom-color:var(--gold-line); }
  .pdv-row .loja{ font-weight:600; }
  .destaque-star{ color:var(--gold); font-weight:700; margin-right:4px; }
  .pdv-row .meta{ color:var(--muted); font-size:12px; }
  .pdv-row .days{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .pdv-row .day-pill{ font-size:11px; padding:2px 7px; border-radius:6px; background:var(--navy); color:var(--navy-ink); font-weight:700; }
  .pdv-row .day-pill.off{ background:transparent; color:var(--muted); border:1px dashed var(--border); }
  .empty{ color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }
  .eyebrow{ color:var(--muted); font-size:13px; margin-bottom:14px; }
  .eyebrow:empty{ display:none; }
  .sup-actions{ border-top:1px solid var(--border); margin-top:14px; padding-top:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn-danger{ border-color:#C0262D; color:#C0262D; }
  .btn-danger:hover{ background:#FDECEA; }
  .btn-ghost{ border-color:var(--navy); color:var(--navy); }
  .btn-ghost:hover{ background:#EEF0F6; }
  .action-msg{ font-size:12px; color:var(--muted); }
  @media (max-width: 860px){
    .testeira{ height:60px; padding:0 16px; }
    .testeira::before{ clip-path:polygon(0 0, 62% 0, 56% 100%, 0 100%); }
    .testeira .logo-spot{ height:18px; }
    .testeira .logo-essity{ height:30px; }
    .testeira .titulo{ display:none; }
    .wrap{ padding:18px 16px 40px; }
    .week-mini{ grid-template-columns:repeat(3,1fr); }
    .sup-head .pct{ text-align:left; width:100%; order:3; }
  }
</style>
</head>
<body>

<header class="testeira">
  <img class="logo-spot" src="img/logo_spot.png" alt="SPOT">
  <span class="titulo">Painel Gerencial</span>
  <img class="logo-essity" src="img/logo_essity.png" alt="Essity">
</header>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Agenda de visitas dos supervisores</h1>
      <div class="sub" id="weekLabel">Carregando semana…</div>
    </div>
    <div class="refresh-row">
      <span class="sub" id="lastUpdated"></span>
      <button id="refreshBtn">Atualizar</button>
    </div>
  </header>

  <section class="panel">
    <span class="tag">Indicadores da semana</span>
    <div class="panel-body"><div class="stats-row" id="statsRow"></div></div>
  </section>

  <div class="eyebrow" id="eyebrow"></div>

  <section class="panel">
    <span class="tag">Supervisores</span>
    <div class="panel-body"><div class="sup-list" id="supList"></div></div>
  </section>
</div>
<iframe name="syncFrame" id="syncFrame" style="display:none"></iframe>

<script>
(function(){
  "use strict";

  var DATA_URL = "agenda_dados.csv";
  var WEEK_URL = "agenda_semana.txt";
  var SYNC_URL = "COLE_AQUI_URL_DO_APPS_SCRIPT"; // termina em /exec
  var DETAIL_CSV_URL = "COLE_AQUI_CSV_PUBLICADO_ABA_DETALHE";
  var STATUS_CSV_URL = "COLE_AQUI_CSV_PUBLICADO_ABA_STATUS";

  var DAYS = [
    {code:"SEG", label:"Seg"},
    {code:"TER", label:"Ter"},
    {code:"QUA", label:"Qua"},
    {code:"QUI", label:"Qui"},
    {code:"SEX", label:"Sex"},
    {code:"SAB", label:"Sáb"}
  ];

  var rows = [];
  var WEEK_ID = "";
  var roster = {}; // { sup: { pdvs:[...], promotores:{} } }
  var statusBySup = {};
  var detailBySup = {}; // sup -> { chave: [dia,...] }

  function norm(s){ return (s||"").toString().trim(); }

  function findCol(header, names){
    for (var i=0;i<header.length;i++){
      var h = header[i].toUpperCase().replace(/﻿/g,"").trim();
      for (var j=0;j<names.length;j++){ if (h === names[j]) return i; }
    }
    return -1;
  }

  function parseCSV(text){
    var lines = text.replace(/﻿/g,"").split(/\r?\n/).filter(function(l){ return l.trim().length; });
    if (!lines.length) return [];
    var header = lines[0].split(";");
    var iPromotor = findCol(header, ["PROMOTOR"]);
    var iSupervisor = findCol(header, ["SUPERVISOR"]);
    var iCDD = findCol(header, ["REGIONAL","CDD"]);
    var iCodPdv = findCol(header, ["COD PDV","CODPDV"]);
    var iChave = findCol(header, ["CHAVE"]);
    var iLoja = findCol(header, ["LOJA"]);
    var iEndereco = findCol(header, ["ENDEREÇO","ENDERECO"]);
    if (iEndereco === -1){
      for (var k=0;k<header.length;k++){
        if (header[k].toUpperCase().replace(/﻿/g,"").trim().indexOf("ENDERE") === 0){ iEndereco = k; break; }
      }
    }
    var iCidade = findCol(header, ["CIDADE"]);
    var iDestaque = findCol(header, ["DESTAQUE"]);
    var iInco = findCol(header, ["INCO"]);

    if (iSupervisor === -1 || iLoja === -1){ return null; }

    var out = [];
    for (var l=1; l<lines.length; l++){
      var cols = lines[l].split(";");
      var chave = iChave>-1 ? norm(cols[iChave]) : (norm(cols[iCodPdv])+"_"+l);
      var sup = norm(cols[iSupervisor]);
      var loja = norm(cols[iLoja]);
      if (!sup || !loja) continue;
      out.push({
        promotor: iPromotor>-1 ? norm(cols[iPromotor]) : "",
        supervisor: sup,
        cdd: (iCDD>-1 ? norm(cols[iCDD]) : "") || "SEM REGIONAL",
        chave: chave || (loja+"_"+l),
        loja: loja,
        endereco: iEndereco>-1 ? norm(cols[iEndereco]) : "",
        cidade: iCidade>-1 ? norm(cols[iCidade]) : "",
        destaque: (iDestaque>-1 && norm(cols[iDestaque]).toUpperCase() === "SIM") ||
                  (iInco>-1 && norm(cols[iInco]).toUpperCase().indexOf("GOLDEN") > -1)
      });
    }
    return out;
  }

  function parseCsvGeneric(text){
    var lines = [];
    var i=0, field="", row=[], inQuotes=false;
    text = (text||"").replace(/\r\n/g,"\n").replace(/^﻿/,"");
    while (i < text.length){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ','){ row.push(field); field=""; i++; continue; }
        if (c === '\n'){ row.push(field); lines.push(row); row=[]; field=""; i++; continue; }
        field += c; i++; continue;
      }
    }
    if (field.length || row.length){ row.push(field); lines.push(row); }
    return lines.filter(function(r){ return r.length>1 || (r[0]||"").trim().length; });
  }

  function csvUrlWithCacheBust(url){
    return url + (url.indexOf("?")>-1 ? "&" : "?") + "_ts=" + Date.now() + Math.random().toString(36).slice(2);
  }

  function buildRoster(){
    roster = {};
    var seen = {};
    rows.forEach(function(r){
      if (!roster[r.supervisor]){ roster[r.supervisor] = { pdvs: [], promotores: {} }; seen[r.supervisor] = {}; }
      if (r.promotor) roster[r.supervisor].promotores[r.promotor] = true;
      var existing = seen[r.supervisor][r.chave];
      if (existing){
        if (r.promotor && existing.promotorList.indexOf(r.promotor) === -1) existing.promotorList.push(r.promotor);
        existing.promotor = existing.promotorList.join(" | ");
        return;
      }
      var p = Object.assign({}, r, { promotorList: r.promotor ? [r.promotor] : [] });
      seen[r.supervisor][r.chave] = p;
      roster[r.supervisor].pdvs.push(p);
    });
  }

  function loadWeek(){
    // cache-busting na URL, nao só no header, porque proxies/CDN intermediarios podem
    // ignorar cache:no-store e servir uma copia antiga por tempo indeterminado.
    return fetch(csvUrlWithCacheBust(WEEK_URL), {cache:"no-store"}).then(function(res){
      return res.ok ? res.text() : "";
    }).then(function(text){
      WEEK_ID = (text||"").trim();
    }).catch(function(){ WEEK_ID = ""; });
  }

  function loadRoster(){
    return fetch(csvUrlWithCacheBust(DATA_URL), {cache:"no-store"}).then(function(res){
      if (!res.ok) throw new Error("http "+res.status);
      return res.text();
    }).then(function(text){
      var parsed = parseCSV(text);
      if (!parsed) throw new Error("csv invalido");
      rows = parsed;
      buildRoster();
    });
  }

  function loadRemote(){
    return Promise.all([
      fetch(csvUrlWithCacheBust(DETAIL_CSV_URL), {cache:"no-store"}).then(function(r){ return r.text(); }),
      fetch(csvUrlWithCacheBust(STATUS_CSV_URL), {cache:"no-store"}).then(function(r){ return r.text(); })
    ]).then(function(results){
      var detailRows = parseCsvGeneric(results[0]);
      var statusRows = parseCsvGeneric(results[1]);

      statusBySup = {};
      if (statusRows.length){
        var sHeader = statusRows[0];
        var sIdx = {};
        sHeader.forEach(function(h,i){ sIdx[h.trim().toUpperCase()] = i; });
        for (var s=1; s<statusRows.length; s++){
          var srow = statusRows[s];
          var sup = norm(srow[sIdx["SUPERVISOR"]]);
          if (!sup) continue;
          var semana = norm(srow[sIdx["SEMANA"]]);
          if (WEEK_ID && semana !== WEEK_ID) continue;
          var lockedRaw = sIdx["LOCKED"]>-1 ? (srow[sIdx["LOCKED"]]||"") : "";
          statusBySup[sup] = {
            semana: semana,
            gravadoEm: srow[sIdx["GRAVADO_EM"]] || "",
            totalPdvs: parseInt(srow[sIdx["TOTAL_PDVS"]], 10) || 0,
            totalAgendados: parseInt(srow[sIdx["TOTAL_AGENDADOS"]], 10) || 0,
            locked: sIdx["LOCKED"]>-1 ? (lockedRaw.trim().toUpperCase() === "SIM") : (parseInt(srow[sIdx["TOTAL_AGENDADOS"]],10) > 0)
          };
        }
      }

      detailBySup = {};
      if (detailRows.length){
        var dHeader = detailRows[0];
        var dIdx = {};
        dHeader.forEach(function(h,i){ dIdx[h.trim().toUpperCase()] = i; });
        for (var d=1; d<detailRows.length; d++){
          var drow = detailRows[d];
          var dsup = norm(drow[dIdx["SUPERVISOR"]]);
          if (!dsup) continue;
          var dsemana = norm(drow[dIdx["SEMANA"]]);
          if (WEEK_ID && dsemana !== WEEK_ID) continue;
          var chave = drow[dIdx["CHAVE"]] || "";
          var dia = drow[dIdx["DIA"]] || "";
          if (!chave || !dia) continue;
          if (!detailBySup[dsup]) detailBySup[dsup] = {};
          if (!detailBySup[dsup][chave]) detailBySup[dsup][chave] = [];
          if (detailBySup[dsup][chave].indexOf(dia) === -1) detailBySup[dsup][chave].push(dia);
        }
      }
    });
  }

  function postToSheet(payload){
    return new Promise(function(resolve){
      var iframe = document.getElementById("syncFrame");
      var form = document.createElement("form");
      form.method = "POST";
      form.action = SYNC_URL;
      form.target = "syncFrame";
      form.style.display = "none";
      var input = document.createElement("input");
      input.type = "hidden";
      input.name = "payload";
      input.value = JSON.stringify(payload);
      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
      setTimeout(function(){ resolve(true); }, 900);
    });
  }

  function resetSupervisor(sup){
    return postToSheet({
      supervisor: sup,
      semana: WEEK_ID,
      totalPdvs: roster[sup] ? roster[sup].pdvs.length : 0,
      totalAgendados: 0,
      entries: []
    });
  }

  function unlockSupervisor(sup){
    return postToSheet({ action: "unlock", supervisor: sup, semana: WEEK_ID });
  }

  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function formatDateTime(iso){
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    function pad(n){ return n<10 ? "0"+n : ""+n; }
    return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" às "+pad(d.getHours())+":"+pad(d.getMinutes());
  }

  function renderStats(){
    var sups = Object.keys(roster).sort();
    var totalSup = sups.length;
    var gravados = sups.filter(function(s){ return statusBySup[s] && statusBySup[s].locked; }).length;

    var totalPdvsGeral = 0, totalAgendadosGeral = 0;
    var destaqueTotalGeral = 0, destaqueAgendadosGeral = 0;
    sups.forEach(function(s){
      totalPdvsGeral += roster[s].pdvs.length;
      totalAgendadosGeral += (statusBySup[s] ? statusBySup[s].totalAgendados : 0);
      var det = detailBySup[s] || {};
      roster[s].pdvs.forEach(function(p){
        if (!p.destaque) return;
        destaqueTotalGeral++;
        if (det[p.chave] && det[p.chave].length) destaqueAgendadosGeral++;
      });
    });

    var pctSup = totalSup ? Math.round((gravados/totalSup)*100) : 0;
    var pctPdv = totalPdvsGeral ? Math.round((totalAgendadosGeral/totalPdvsGeral)*100) : 0;
    var pctDestaque = destaqueTotalGeral ? Math.round((destaqueAgendadosGeral/destaqueTotalGeral)*100) : 0;

    var html = "";
    html += "<div class='stat-card'><div class='label'>Supervisores gravaram</div><div class='value'>"+gravados+"/"+totalSup+"</div><div class='sub'>"+pctSup+"% da equipe</div></div>";
    html += "<div class='stat-card'><div class='label'>Pendentes</div><div class='value'>"+(totalSup-gravados)+"</div><div class='sub'>ainda não gravaram esta semana</div></div>";
    html += "<div class='stat-card'><div class='label'>PDVs agendados</div><div class='value'>"+totalAgendadosGeral+"/"+totalPdvsGeral+"</div><div class='sub'>"+pctPdv+"% da carteira total</div></div>";
    html += "<div class='stat-card gold'><div class='label'>★ Golden Store agendadas</div><div class='value'>"+destaqueAgendadosGeral+"/"+destaqueTotalGeral+"</div><div class='sub'>"+pctDestaque+"% das Golden Store</div></div>";
    document.getElementById("statsRow").innerHTML = html;
  }

  function dayCounts(sup){
    var counts = {};
    DAYS.forEach(function(d){ counts[d.code] = 0; });
    var det = detailBySup[sup];
    if (det){
      Object.keys(det).forEach(function(chave){
        det[chave].forEach(function(diaLabel){
          var day = DAYS.filter(function(d){ return d.label === diaLabel; })[0];
          if (day) counts[day.code]++;
        });
      });
    }
    return counts;
  }

  function renderSupBody(sup){
    var det = detailBySup[sup] || {};
    var counts = dayCounts(sup);
    var html = "<div class='week-mini'>";
    DAYS.forEach(function(d){
      html += "<div class='d'><div class='n'>"+d.label+"</div><div class='c'>"+counts[d.code]+"</div></div>";
    });
    html += "</div>";

    var pdvs = roster[sup] ? roster[sup].pdvs.slice() : [];
    var byGroup = {};
    var groupOrder = [];
    pdvs.forEach(function(p){
      if (!byGroup[p.cdd]){ byGroup[p.cdd] = []; groupOrder.push(p.cdd); }
      byGroup[p.cdd].push(p);
    });
    groupOrder.sort();

    if (!pdvs.length){
      html += "<div class='empty'>Nenhum PDV cadastrado para este supervisor na base atual.</div>";
    }

    groupOrder.forEach(function(cdd){
      html += "<div class='cdd-group'><h4>"+esc(cdd)+" · "+byGroup[cdd].length+" PDVs</h4>";
      byGroup[cdd].forEach(function(p){
        var diasMarcados = det[p.chave] || [];
        html += "<div class='pdv-row"+(p.destaque?" destaque":"")+"'>";
        html += "<div class='info'><div class='loja'>"+(p.destaque?"<span class='destaque-star'>★</span>":"")+esc(p.loja)+"</div><div class='meta'>"+esc(p.cidade)+(p.promotor?" · "+esc(p.promotor):"")+"</div></div>";
        html += "<div class='days'>";
        DAYS.forEach(function(d){
          var marcado = diasMarcados.indexOf(d.label) > -1;
          html += "<span class='day-pill"+(marcado?"":" off")+"'>"+d.label+"</span>";
        });
        html += "</div></div>";
      });
      html += "</div>";
    });

    if (statusBySup[sup]){
      html += "<div class='sup-actions'>";
      if (statusBySup[sup].locked){
        html += "<button class='btn-ghost' data-unlock-sup=\""+sup.replace(/"/g,"&quot;")+"\">Liberar para edição</button>";
      }
      html += "<button class='btn-danger' data-reset-sup=\""+sup.replace(/"/g,"&quot;")+"\">Zerar agenda desta semana</button>";
      html += "<span class='action-msg'></span>";
      html += "</div>";
    }

    return html;
  }

  function renderList(){
    var sups = Object.keys(roster).sort();
    var html = "";
    sups.forEach(function(sup){
      var st = statusBySup[sup];
      var total = roster[sup].pdvs.length;
      var agendados = st ? st.totalAgendados : 0;
      var pct = total ? Math.round((agendados/total)*100) : 0;
      var gravado = st && st.locked;
      html += "<div class='sup-card' data-sup=\""+sup.replace(/"/g,"&quot;")+"\">";
      html += "<div class='sup-head'>";
      html += "<span class='badge "+(gravado?"ok":"pending")+"'>"+(gravado?"GRAVADO":"PENDENTE")+"</span>";
      html += "<span class='name'>"+esc(sup)+"</span>";
      html += "<span class='pct'>"+agendados+"/"+total+" PDVs ("+pct+"%)"+(st&&st.gravadoEm?" · "+formatDateTime(st.gravadoEm):"")+"</span>";
      html += "<span class='chev'>›</span>";
      html += "</div>";
      html += "<div class='sup-body'></div>";
      html += "</div>";
    });
    document.getElementById("supList").innerHTML = html || "<div class='empty'>Nenhum supervisor encontrado na base atual.</div>";

    document.querySelectorAll(".sup-card").forEach(function(card){
      var head = card.querySelector(".sup-head");
      head.addEventListener("click", function(){
        var isOpen = card.classList.contains("open");
        if (isOpen){
          card.classList.remove("open");
          return;
        }
        var sup = card.getAttribute("data-sup");
        card.querySelector(".sup-body").innerHTML = renderSupBody(sup);
        card.classList.add("open");
      });
    });

    var supListEl = document.getElementById("supList");
    if (supListEl.getAttribute("data-bound")) return;
    supListEl.setAttribute("data-bound", "1");
    supListEl.addEventListener("click", function(e){
      var resetBtn = e.target.closest("[data-reset-sup]");
      if (resetBtn){
        e.stopPropagation();
        var sup = resetBtn.getAttribute("data-reset-sup");
        if (!confirm("Isso zera a agenda de "+sup+" para a semana atual, liberando para refazer do zero. Não dá pra desfazer. Confirma?")) return;
        var msg = resetBtn.parentElement.querySelector(".action-msg");
        resetBtn.disabled = true;
        msg.textContent = "Zerando…";
        resetSupervisor(sup).then(function(){
          msg.textContent = "Zerado ✓ atualizando painel…";
          return loadAll();
        }).catch(function(){
          msg.textContent = "Falha ao zerar — tente de novo.";
          resetBtn.disabled = false;
        });
        return;
      }

      var unlockBtn = e.target.closest("[data-unlock-sup]");
      if (unlockBtn){
        e.stopPropagation();
        var supU = unlockBtn.getAttribute("data-unlock-sup");
        if (!confirm("Isso libera "+supU+" para editar a agenda desta semana de novo, mantendo o que já estava marcado. Confirma?")) return;
        var msgU = unlockBtn.parentElement.querySelector(".action-msg");
        unlockBtn.disabled = true;
        msgU.textContent = "Liberando…";
        unlockSupervisor(supU).then(function(){
          msgU.textContent = "Liberado ✓ atualizando painel…";
          return loadAll();
        }).catch(function(){
          msgU.textContent = "Falha ao liberar — tente de novo.";
          unlockBtn.disabled = false;
        });
      }
    });
  }

  function renderAll(){
    var weekLabelEl = document.getElementById("weekLabel");
    weekLabelEl.textContent = WEEK_ID ? ("Semana publicada em "+WEEK_ID.split("-").reverse().join("/")+" · prazo de gravação: quinta-feira") : "Semana não identificada (agenda_semana.txt ausente)";
    renderStats();
    renderList();
    document.getElementById("lastUpdated").textContent = "Atualizado às "+formatDateTime(new Date().toISOString());
  }

  function loadAll(){
    var btn = document.getElementById("refreshBtn");
    var eyebrow = document.getElementById("eyebrow");
    btn.disabled = true;
    eyebrow.textContent = "Carregando dados…";
    return loadWeek().then(loadRoster).then(loadRemote).then(function(){
      eyebrow.textContent = "";
      renderAll();
    }).catch(function(err){
      eyebrow.textContent = "Erro ao carregar dados: "+err.message;
    }).finally(function(){
      btn.disabled = false;
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", loadAll);
  loadAll();
})();
</script>
</body>
</html>
